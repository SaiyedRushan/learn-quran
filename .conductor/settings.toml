"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# npm project (package-lock.json). Installs deps into the workspace's own node_modules.
setup = "npm install"
# Static Next.js app with no shared local resource; each workspace gets its own
# CONDUCTOR_PORT range, so multiple workspaces can run at the same time.
run_mode = "concurrent"

[scripts.run.dev]
command = "npm run dev -- --port $CONDUCTOR_PORT"
default = true
icon = "play"

[scripts.run.build]
command = "npm run build"
icon = "package"

[scripts.run.lint]
command = "npm run lint"
icon = "wrench"
